name: Read-only WhiteSource backlog audit (experiment)
on:
  push:
    branches:
      - experiment/whitesource-backlog-audit-20261011
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Audit public voku PRs without writing to repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          
          API = "https://api.github.com"
          TITLE = "Configure WhiteSource Bolt for GitHub"
          DATE = "2020-12-16"
          QUERY = 'user:voku is:pr is:open created:2020-12-16 "Configure WhiteSource Bolt for GitHub"'
          TOKEN = os.environ["GH_TOKEN"]
          SAFE_PULL = re.compile(r"^https://api\.github\.com/repos/voku/[A-Za-z0-9_.-]+/pulls/[0-9]+$")
          
          def get(url):
              if not (url.startswith(API + "/search/issues?") or SAFE_PULL.fullmatch(url) or
                      (url.endswith("/files?per_page=100") and SAFE_PULL.fullmatch(url[:-19]))):
                  raise ValueError("Unapproved GitHub API URL: " + url)
              for attempt in range(4):
                  request = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + TOKEN,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "voku-read-only-whitesource-audit",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          return json.load(response)
                  except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                      retryable = not isinstance(exc, urllib.error.HTTPError) or exc.code in (429, 500, 502, 503, 504)
                      if not retryable or attempt == 3:
                          raise RuntimeError("GitHub request failed: " + url + ": " + str(exc)) from exc
                      time.sleep(2 ** attempt)
              raise AssertionError("unreachable")
          
          def classify(item):
              pull_url = item.get("pull_request", {}).get("url", "")
              reasons = []
              if not SAFE_PULL.fullmatch(pull_url):
                  return {"url": item.get("html_url"), "category": "not_voku_pull", "reasons": ["invalid PR locator"]}
              pr = get(pull_url)
              if item.get("title") != TITLE or pr.get("title") != TITLE:
                  reasons.append("title mismatch")
              if not str(pr.get("created_at", "")).startswith(DATE):
                  reasons.append("creation date mismatch")
              if pr.get("state") != "open" or pr.get("merged_at") is not None:
                  reasons.append("no longer open/unmerged")
              if pr.get("user", {}).get("login") != "mend-bolt-for-github[bot]":
                  reasons.append("unexpected PR author")
              if pr.get("draft"):
                  reasons.append("draft")
              if pr.get("commits") != 1:
                  reasons.append("multi-commit change")
              if int(item.get("comments", -1)) != 0 or int(pr.get("review_comments", -1)) != 0:
                  reasons.append("comments or review discussions present")
              if pr.get("changed_files") != 1:
                  reasons.append("not exactly one changed file")
              else:
                  files = get(pull_url + "/files?per_page=100")
                  if len(files) != 1 or files[0].get("filename") != ".whitesource" or files[0].get("status") not in ("added", "modified"):
                      reasons.append("unexpected file or status")
              return {
                  "url": pr.get("html_url"),
                  "repository": pr.get("base", {}).get("repo", {}).get("full_name"),
                  "number": pr.get("number"),
                  "head_sha": pr.get("head", {}).get("sha"),
                  "created_at": pr.get("created_at"),
                  "category": "candidate" if not reasons else "manual_review",
                  "reasons": reasons,
              }
          
          def main():
              issues = []
              page = 1
              count = None
              while True:
                  query = urllib.parse.urlencode({"q": QUERY, "per_page": "100", "page": str(page)})
                  result = get(API + "/search/issues?" + query)
                  if result.get("incomplete_results"):
                      raise RuntimeError("GitHub search was incomplete")
                  total = int(result["total_count"])
                  if total > 1000:
                      raise RuntimeError("GitHub Search API capped the candidate set")
                  if count is None:
                      count = total
                  elif count != total:
                      raise RuntimeError("Search results changed during pagination; rerun the audit")
                  batch = result["items"]
                  issues.extend(batch)
                  if len(issues) >= total:
                      break
                  if not batch:
                      raise RuntimeError("Unexpected empty search page")
                  page += 1
                  if page > 10:
                      raise RuntimeError("Unexpected pagination depth")
              if len(issues) != count or len({i["id"] for i in issues}) != len(issues):
                  raise RuntimeError("Incomplete or duplicate PR inventory")
          
              rows = []
              for index, issue in enumerate(issues, start=1):
                  rows.append(classify(issue))
                  if index % 25 == 0:
                      print(f"Checked {index}/{len(issues)} pull requests", flush=True)
              totals = dict(Counter(r["category"] for r in rows))
              report = {
                  "schema": "voku.whitesource-backlog-audit.v1",
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "query": QUERY,
                  "searched_count": count,
                  "analyzed_count": len(rows),
                  "totals": totals,
                  "read_only": True,
                  "pull_requests": sorted(rows, key=lambda r: (r.get("repository") or "", r.get("number") or 0)),
              }
              output = Path("audit-output")
              output.mkdir(parents=True, exist_ok=True)
              (output / "report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              summary = [
                  "## Read-only WhiteSource backlog audit",
                  f"- Search results: {count}",
                  f"- Automatically eligible for human-reviewed close batch: {totals.get('candidate', 0)}",
                  f"- Needs manual review: {totals.get('manual_review', 0)}",
                  "- Mutations performed: 0",
                  "",
                  "### First 20 manual-review exclusions",
              ]
              for entry in [r for r in rows if r["category"] != "candidate"][:20]:
                  summary.append("- " + str(entry["url"]) + ": " + ", ".join(entry["reasons"]))
              summary.append("")
              summary.append("All candidate identities and exact head SHAs are in report.json. Re-check each HEAD before closure.")
              body = "\n".join(summary) + "\n"
              print(body, flush=True)
              github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if github_summary:
                  with open(github_summary, "a", encoding="utf-8") as stream:
                      stream.write(body)
              if count == 0:
                  raise RuntimeError("Unexpectedly empty 2020 WhiteSource cohort")
          
          if __name__ == "__main__":
              main()
          PY
      - name: Preserve exact snapshot of read-only findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitesource-backlog-read-only-inventory
          path: audit-output/report.json
          if-no-files-found: warn
          retention-days: 14
